<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Attach sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0F0B0B}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; display: flex; flex-direction: column; background: #0F0B0B; color: #F4EBE1; font-family: ui-sans-serif, -apple-system, system-ui, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif">

  <div style="flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 16px 12px 12px; box-sizing: border-box">
    <div style="align-self: center; font-size: 12px; color: rgba(244,235,225,0.65); padding: 16px 0 10px">Today</div>
    <div style="align-self: flex-end; max-width: 84%; background: #2D2223; border-radius: 20px; padding: 10px 14px; font-size: 16px; line-height: 1.4">Here's the plan I mentioned.</div>
    <div style="align-self: flex-start; max-width: 84%; margin-top: 10px; background: #7C3AED; border-radius: 20px; padding: 10px 14px; font-size: 16px; line-height: 1.4">Send it over, and I'll read it.</div>
  </div>

  <div style="flex-shrink: 0; box-sizing: border-box; padding: 8px 12px 28px; background: #0F0B0B">
    <div style="display: flex; align-items: flex-end; gap: 6px; box-sizing: border-box; background: #2D2223; border: 1px solid #F4EBE1; border-radius: 26px; padding: 5px">
      <button aria-label="Attach a file" style="flex-shrink: 0; width: 40px; height: 40px; border: 0; border-radius: 999px; background: #3A2D2E; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4EBE1" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      </button>
      <div style="flex: 1 1 0; height: 84px; padding: 9px 0 9px 6px; box-sizing: border-box; font-size: 16px; line-height: 22px; color: rgba(244,235,225,0.65)">Message Donna</div>
      <button disabled="{{ true }}" aria-label="Send" style="flex-shrink: 0; width: 40px; height: 40px; border: 0; border-radius: 999px; background: #7C3AED; opacity: 0.35; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4EBE1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end">
    <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.55)"></div>
    <section aria-label="Attach" style="position: relative; background: #1F1718; border-radius: 22px 22px 0 0; padding: 10px 12px 28px; display: flex; flex-direction: column; gap: 6px">
      <div aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 999px; background: #3A2D2E; margin-bottom: 8px"></div>
      <button style="min-height: 56px; border: 0; border-radius: 14px; background: #2D2223; color: #F4EBE1; font: inherit; font-size: 16px; display: flex; align-items: center; gap: 14px; padding: 0 16px; text-align: left">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F4EBE1" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
        <span style="display: flex; flex-direction: column"><span>Choose a file</span><span style="font-size: 12px; color: rgba(244,235,225,0.65)">Text, CSV or PDF. 10 MB each, five at a time</span></span>
      </button>
      <button style="min-height: 56px; border: 0; border-radius: 14px; background: #2D2223; color: #F4EBE1; font: inherit; font-size: 16px; display: flex; align-items: center; gap: 14px; padding: 0 16px; text-align: left">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F4EBE1" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>
        <span>Choose a photo</span>
      </button>
      <button style="min-height: 52px; margin-top: 4px; border: 0; border-radius: 14px; background: transparent; color: #F4EBE1; font: inherit; font-size: 16px; font-weight: 600">Cancel</button>
    </section>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
