<!doctype html>
<!-- Mockup for joshevensen/donna#11: the chat page with the command picker, the Settings drawer and command answers. Styles are resources/css/app.css plus the new rules marked "New for #11". -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat — mockup for #11</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f4f5; --fg:#18181b; --muted:#71717a; --line:#d4d4d8; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#18181b; --fg:#fafafa; --muted:#a1a1aa; --line:#3f3f46; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  .bar { position:sticky; top:0; z-index:1; display:flex; flex-wrap:wrap; gap:8px; align-items:center;
         padding:8px 16px; background:var(--bg); border-bottom:1px solid var(--line); }
  .bar strong { margin-right:auto; }
  .bar button { font:inherit; padding:4px 10px; border:1px solid var(--line); border-radius:6px;
                background:transparent; color:var(--fg); cursor:pointer; }
  .bar button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
  .bar .sep { width:1px; height:20px; background:var(--line); }
  .stage { display:flex; justify-content:center; padding:16px; }
  iframe { width:var(--w,1280px); max-width:100%; height:calc(100vh - 90px); border:1px solid var(--line);
           border-radius:8px; background:#0f0b0b; }
</style>
</head>
<body>
<div class="bar">
  <strong>Chat</strong>
  <button data-w="390" aria-pressed="false">Phone</button>
  <button data-w="768" aria-pressed="false">Tablet</button>
  <button data-w="1280" aria-pressed="true">Desktop</button>
  <span class="sep"></span>
  <span id="states"></span>
  <span class="sep"></span>
  <button id="hl" aria-pressed="false">Highlight changes</button>
</div>
<div class="stage"><iframe id="view" title="Mockup"></iframe></div>

<template id="PAGE_HEAD">
<style>
/*
 | Donna's web app. Dark only; the tokens are the ones in docs/design.md.
 | Text is sized in rem so the browser's text size is respected. Nothing here
 | is inline: the page's Content-Security-Policy only allows this stylesheet.
 */

:root {
    --donna-canvas: #0f0b0b;
    --donna-inset: #1a1414;
    --donna-panel: #1f1718;
    --donna-raised: #2d2223;
    --donna-hover: #3a2d2e;
    --donna-accent: #7c3aed;
    --donna-error: #e05a55;
    --donna-shirt: #f4ebe1;
    --donna-tie: #1e1718;

    --donna-shirt-65: rgb(244 235 225 / 65%);
    --donna-shirt-35: rgb(244 235 225 / 35%);
    --donna-canvas-45: rgb(15 11 11 / 45%);

    --font-sans: ui-sans-serif, -apple-system, system-ui, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;

    color-scheme: dark;
}

*,
*::before,
*::after {
    box-sizing: border-box;
}

html,
body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--donna-canvas);
}

body {
    color: var(--donna-shirt);
    font-family: var(--font-sans);
    font-size: 1rem;
    line-height: 1.4;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
}

#app {
    height: 100%;
}

button,
input,
textarea {
    font: inherit;
    color: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    cursor: default;
}

/* Focus rings are Shirt: it is the one color that shows on every surface. */
:focus-visible {
    outline: 2px solid var(--donna-shirt);
    outline-offset: 2px;
}

.visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
}

/*
 | The chat: one column that fills the screen, the input pinned to its
 | bottom. While the keyboard is up the hook pins it to the visual viewport
 | (position, top and height are set from script).
 */

.chat {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    overflow: hidden;
    background: var(--donna-canvas);
}

.chat[data-keyboard="open"] {
    position: fixed;
    right: 0;
    left: 0;
}

@media (min-width: 768px) {
    .chat {
        max-width: 600px;
    }
}

/* In the installed app the page runs under the status bar; keep the clock off the messages. */
.chat__status-bar {
    flex-shrink: 0;
    height: env(safe-area-inset-top, 0px);
    background: var(--donna-canvas);
}

/* Newest at the bottom. Reversing the column keeps the view anchored there. */
.messages {
    display: flex;
    flex: 1 1 0;
    flex-direction: column-reverse;
    min-height: 0;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;

    /* The thread keeps its own place when messages arrive; browsers differ if left to it. */
    overflow-anchor: none;
}

.thread {
    display: flex;
    flex-direction: column;
    padding: 16px 12px 12px;
}

.thread__older {
    align-self: center;
    padding: 8px 0;
    color: var(--donna-shirt-65);
    font-size: 0.75rem;
}

.date-divider {
    align-self: center;
    padding: 16px 0 10px;
    color: var(--donna-shirt-65);
    font-size: 0.75rem;
}

/* Bubbles */

.row {
    display: flex;
    flex-direction: column;
    min-width: 0;
    margin-top: 2px;
}

.row[data-first="true"] {
    margin-top: 10px;
}

.thread > .row:first-child {
    margin-top: 0;
}

.row[data-who="josh"] {
    align-items: flex-end;
}

.row[data-who="donna"] {
    align-items: flex-start;
}

.bubble {
    position: relative;
    min-width: 0;
    max-width: 84%;
    padding: 10px 14px;
    overflow-wrap: anywhere;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1.4;
}

.row[data-who="josh"] .bubble {
    background: var(--donna-raised);
    white-space: pre-wrap;
}

.row[data-who="donna"] .bubble {
    background: var(--donna-accent);
}

.bubble[data-code-only="true"] {
    width: 84%;
    padding: 6px;
}

.bubble[data-sending="true"] {
    opacity: 0.65;
}

.row__info {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    padding: 4px 6px 0;
    color: var(--donna-shirt-65);
    font-size: 0.75rem;
}

.row__info-separator {
    padding: 0 4px;
}

.link-button {
    min-height: 44px;
    padding: 0 2px;
    border: 0;
    background: transparent;
    color: var(--donna-shirt);
    font-size: inherit;
    text-decoration: underline;
    text-underline-offset: 3px;
}

/* For keyboards and screen readers: the bubble itself is the tap target. */
.row__toggle:not(:focus-visible) {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
}

.row__toggle {
    border: 0;
    background: transparent;
    color: var(--donna-shirt-65);
    font-size: 0.75rem;
}

/* Markdown inside Donna's bubbles */

.markdown {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
}

.markdown > * {
    margin: 0;
}

.markdown :is(h1, h2, h3, h4, h5, h6) {
    font-size: 1rem;
    font-weight: 600;
}

.markdown :is(ul, ol) {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-left: 20px;
}

.markdown li > :is(ul, ol) {
    margin-top: 4px;
}

.markdown li > p {
    margin: 0;
}

.markdown a {
    color: var(--donna-shirt);
    text-decoration: underline;
    text-underline-offset: 3px;
}

.markdown :not(pre) > code {
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--donna-canvas-45);
    font-family: var(--font-mono);
    font-size: 0.875rem;
}

.markdown blockquote {
    padding-left: 10px;
    border-left: 2px solid var(--donna-shirt-65);
}

.markdown hr {
    width: 100%;
    border: 0;
    border-top: 1px solid var(--donna-shirt-35);
}

.markdown table {
    display: block;
    overflow-x: auto;
    border-collapse: collapse;
    font-size: 0.875rem;
}

.markdown :is(th, td) {
    padding: 4px 8px;
    border-bottom: 1px solid var(--donna-shirt-35);
    text-align: left;
}

.code-block {
    min-width: 0;
    overflow: hidden;
    border-radius: 14px;
    background: var(--donna-canvas);
    cursor: auto;
}

.code-block__bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 44px;
    padding: 0 4px 0 14px;
    border-bottom: 1px solid var(--donna-inset);
}

.code-block__language {
    color: var(--donna-shirt-65);
    font-family: var(--font-mono);
    font-size: 0.75rem;
}

.code-block__copy {
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    padding: 0 12px;
    border: 0;
    background: transparent;
    font-size: 0.8125rem;
}

.code-block pre {
    margin: 0;
    padding: 12px 14px;
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: 0.8125rem;
    line-height: 1.55;
    white-space: pre;
    tab-size: 4;
}

/* Typing dots: the one piece of motion, and still for anyone who asks for less. */

.typing {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 15px 16px;
    background: var(--donna-accent);
}

.typing__dot {
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: var(--donna-shirt);
    animation: donna-dot 1.1s ease-in-out infinite;
}

.typing__dot:nth-child(2) {
    animation-delay: 0.16s;
}

.typing__dot:nth-child(3) {
    animation-delay: 0.32s;
}

@keyframes donna-dot {
    0%,
    60%,
    100% {
        transform: translateY(0);
        opacity: 0.55;
    }

    30% {
        transform: translateY(-6px);
        opacity: 1;
    }
}

@media (prefers-reduced-motion: reduce) {
    .typing__dot {
        animation: none;
    }
}

/* Errors: always Error red, always an icon and words. */

.not-delivered {
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    margin-top: 2px;
    padding: 0 6px;
    border: 0;
    background: transparent;
    color: var(--donna-error);
    font-size: 0.8125rem;
}

.reply-failed {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    align-self: center;
    justify-content: center;
    gap: 2px 8px;
    margin: 10px 0 4px;
    color: var(--donna-error);
    font-size: 0.8125rem;
}

.reply-failed__retry {
    min-height: 44px;
    padding: 0 4px;
    border: 0;
    background: transparent;
    color: var(--donna-error);
    font-size: inherit;
    text-decoration: underline;
    text-underline-offset: 3px;
}

.offline {
    display: flex;
    flex-shrink: 0;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: var(--donna-inset);
    font-size: 0.8125rem;
    line-height: 1.35;
}

.offline__icon {
    display: flex;
    flex-shrink: 0;
    color: var(--donna-error);
}

/* The button Donna offers under a reply. */

.action {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    max-width: 84%;
    margin-top: 6px;
}

.action__note {
    padding: 0 6px;
    color: var(--donna-shirt-65);
    font-size: 0.8125rem;
}

.button {
    min-height: 44px;
    padding: 0 18px;
    border: 0;
    border-radius: 14px;
    background: var(--donna-shirt);
    color: var(--donna-tie);
    font-size: 1rem;
    font-weight: 600;
}

.button:disabled {
    opacity: 0.35;
}

a.button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
}

.button--wide {
    width: 100%;
    min-height: 48px;
}

.button--quiet {
    background: transparent;
    color: var(--donna-shirt);
    font-weight: 400;
}

/*
 | The input. One textarea, always in the page: collapsed it is a slim bar,
 | focused or holding text it opens to three lines and grows to six. Its
 | height is set from script, measured from the text.
 */

.composer {
    flex-shrink: 0;
    padding: 8px 12px max(4px, calc(env(safe-area-inset-bottom, 0px) - 22px));
    background: var(--donna-canvas);
}

.chat[data-keyboard="open"] .composer {
    padding-bottom: 4px;
}

.composer__field {
    display: flex;
    flex-direction: column;
    padding: 5px;
    border: 1px solid transparent;
    border-radius: 26px;
    background: var(--donna-raised);
}

.composer__field:focus-within {
    border-color: var(--donna-shirt);
}

.composer__input {
    display: block;
    width: 100%;
    min-width: 0;
    height: 2.5rem;
    padding: 0.5625rem 12px;
    border: 0;
    outline: none;
    background: transparent;
    font-size: 1rem;
    line-height: 1.375rem;
    resize: none;
    overflow-y: hidden;
}

.composer__input::placeholder {
    color: var(--donna-shirt-65);
    opacity: 1;
}

.composer__bar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 3px 1px;
}

/* In the middle column, so it is centred on the box whatever sits either side. */
.composer__costs {
    grid-column: 2;
    margin: 0;
    color: var(--donna-shirt-65);
    font-size: 0.75rem;
    white-space: nowrap;
}

.composer__send {
    display: flex;
    grid-column: 3;
    justify-self: end;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border: 0;
    border-radius: 999px;
    background: var(--donna-accent);
}

.composer__send:disabled {
    opacity: 0.35;
}

/* The sources sheet */

.sheet {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
}

.sheet__backdrop {
    position: absolute;
    inset: 0;
    width: 100%;
    padding: 0;
    border: 0;
    background: rgb(0 0 0 / 55%);
}

.sheet__panel {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: 85%;
    padding: 10px 16px max(20px, env(safe-area-inset-bottom, 0px));
    border-radius: 22px 22px 0 0;
    background: var(--donna-panel);
}

.sheet__grabber {
    align-self: center;
    width: 36px;
    height: 4px;
    border-radius: 999px;
    background: var(--donna-hover);
}

.sheet__title {
    margin: 4px 0 0;
    font-size: 1.0625rem;
    font-weight: 600;
}

.sheet__list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 0;
    padding: 0;
    overflow-y: auto;
    list-style: none;
}

.source {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 10px 14px;
    border-radius: 12px;
    background: var(--donna-raised);
    font-size: 0.875rem;
    line-height: 1.4;
    overflow-wrap: anywhere;
}

.source__kind {
    color: var(--donna-shirt-65);
    font-size: 0.6875rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
}

.source a {
    color: var(--donna-shirt);
    text-underline-offset: 3px;
}

/* Signing in, and the two one-button pages that arrive from an email. */

.gate {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    width: 100%;
    max-width: 380px;
    min-height: 100%;
    margin: 0 auto;
    padding: max(24px, env(safe-area-inset-top, 0px)) 24px max(24px, env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
    text-align: center;
}

.gate__scroll {
    height: 100%;
    overflow-y: auto;
}

.gate__icon {
    display: block;
    width: 6rem;
    height: 6rem;
    border-radius: 22%;
}

.gate__title {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 600;
}

.gate__text {
    margin: 0;
    color: var(--donna-shirt-65);
    font-size: 0.9375rem;
}

.gate__form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
}

.gate__input {
    width: 100%;
    min-height: 48px;
    padding: 0 16px;
    border: 1px solid transparent;
    border-radius: 14px;
    outline: none;
    background: var(--donna-raised);
    font-size: 1rem;
}

.gate__input:focus-visible {
    border-color: var(--donna-shirt);
    outline: none;
}

.gate__input[aria-invalid="true"] {
    border-color: var(--donna-error);
}

.gate__input--code {
    font-family: var(--font-mono);
    font-size: 1.375rem;
    letter-spacing: 0.3em;
    text-align: center;
}

.gate__input::placeholder {
    color: var(--donna-shirt-35);
    opacity: 1;
}

.gate__error {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 0;
    color: var(--donna-error);
    font-size: 0.875rem;
    text-align: left;
}

.gate__error svg {
    flex-shrink: 0;
}

.gate__secondary {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0 8px;
}

.loading {
    display: grid;
    height: 100%;
    place-items: center;
}

/* ---- New for #11 ---- */
.composer { position: relative; }
.composer__commands {
    display: flex; grid-column: 1; justify-self: start; align-items: center; justify-content: center;
    width: 30px; height: 30px; border: 0; border-radius: 999px;
    background: var(--donna-hover); color: var(--donna-shirt-65);
    font-family: var(--font-mono); font-size: 0.9375rem; font-weight: 600;
}
.composer__commands[aria-expanded="true"] { color: var(--donna-shirt); }
.picker {
    position: absolute; right: 12px; bottom: calc(100% - 2px); left: 12px; z-index: 5;
    display: flex; flex-direction: column; gap: 2px; margin: 0; padding: 6px;
    overflow-y: auto; overscroll-behavior: contain; list-style: none;
    border-radius: 20px; background: var(--donna-panel); box-shadow: 0 8px 28px rgb(0 0 0 / 50%);
}
.picker__item {
    display: flex; flex-direction: column; gap: 2px; width: 100%; padding: 10px 12px;
    border: 0; border-radius: 14px; background: transparent; text-align: left;
}
.picker__item:hover { background: var(--donna-raised); }
.picker__name { font-family: var(--font-mono); font-size: 0.9375rem; }
.picker__description { color: var(--donna-shirt-65); font-size: 0.8125rem; }
.settings { display: flex; flex-direction: column; gap: 8px; }
.setting {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 52px; padding: 10px 14px; border-radius: 12px; background: var(--donna-raised);
}
.setting__label { display: flex; flex-direction: column; gap: 2px; }
.setting__hint { color: var(--donna-shirt-65); font-size: 0.8125rem; }
.switch {
    position: relative; flex-shrink: 0; width: 51px; height: 31px; padding: 0; border: 0;
    border-radius: 999px; background: var(--donna-hover);
}
.switch::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 25px; height: 25px;
    border-radius: 999px; background: var(--donna-shirt-65);
}
.switch[aria-checked="true"] { background: var(--donna-shirt); }
.switch[aria-checked="true"]::after { left: 23px; background: var(--donna-tie); }
.settings__note { margin: 0; padding: 0 4px; color: var(--donna-shirt-65); font-size: 0.8125rem; }
.settings__note[data-error="true"] { color: var(--donna-error); }

</style>
<style>[hidden]{display:none!important}</style>
<style>.orc-hl [data-changed]{ outline:2px dashed #f59e0b; outline-offset:2px; }</style>
</template>

      <li><button type="button" class="picker__item" data-command="/cost"><span class="picker__name">/cost</span><span class="picker__description">What I've cost today and this month</span></button></li>
      <li><button type="button" class="picker__item" data-command="/people"><span class="picker__name">/people</span><span class="picker__description">The people I know about</span></button></li>
      <li><button type="button" class="picker__item" data-command="/projects"><span class="picker__name">/projects</span><span class="picker__description">Your projects and where they stand</span></button></li>
      <li><button type="button" class="picker__item" data-command="/settings"><span class="picker__name">/settings</span><span class="picker__description">Notifications and signing out</span></button></li>
    </ul>
    <div class="composer__field" data-open="true">
      <label for="message" class="visually-hidden">Message Donna</label>
      <textarea id="message" class="composer__input" rows="1" placeholder="Message Donna" style="height:2.5rem"></textarea>
      <div class="composer__bar">
        <button type="button" class="composer__commands" id="slash" aria-label="Commands" aria-expanded="false" data-changed>/</button>
        <p class="composer__costs">Today $0.42 · Cycle $6.10</p>
        <button type="button" class="composer__send" id="send" aria-label="Send" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div class="sheet" id="settings" hidden data-changed>
    <button type="button" class="sheet__backdrop" aria-label="Close" data-close></button>
    <section class="sheet__panel" role="dialog" aria-modal="true" aria-label="Settings">
      <div class="sheet__grabber" aria-hidden="true"></div>
      <h2 class="sheet__title">Settings</h2>
      <div class="settings">
        <div class="setting">
          <span class="setting__label"><span>Notifications</span><span class="setting__hint">On this device</span></span>
          <button type="button" class="switch" role="switch" aria-checked="false" aria-label="Notifications" id="switch"></button>
        </div>
        <p class="settings__note" id="note" hidden></p>
        <button type="button" class="button button--wide button--quiet" id="signout">Sign out</button>
        <button type="button" class="button button--wide button--quiet" id="everywhere">Sign out everywhere</button>
      </div>
      <button type="button" class="button button--wide" data-close>Done</button>
    </section>
  </div>
</div>
</div>
<script>
const ANSWERS = {
  '/cost': '<p><strong>Today</strong> — $0.42 · 18 calls</p><ul><li>Embedding $0.01 · 3</li><li>Reply $0.39 · 12</li><li>Tagging $0.02 · 3</li></ul><p><strong>This month</strong> — $6.10 · 241 calls</p><ul><li>Embedding $0.08 · 31</li><li>Extraction $1.12 · 27</li><li>Reply $4.71 · 158</li><li>Tagging $0.19 · 25</li></ul>',
  '/projects': '<p><strong>Active</strong></p><ul><li>Donna — main</li><li>Kitchen remodel — secondary · Kristen\'s</li></ul><p><strong>Parked</strong></p><ul><li>Storyrift — fun</li></ul><p><strong>Proposed</strong></p><ul><li>Garage gym — fun</li></ul>',
  '/people': '<ul><li>Kristen — wife</li><li>Marcus — brother</li><li>Priya — accountant</li><li>Sam</li></ul>',
  'error': "<p>I couldn't get that. Check your connection and try again.</p>",
};
const $ = (id) => document.getElementById(id);
const input = $('message'), send = $('send'), picker = $('picker'), slash = $('slash'), sheet = $('settings'), thread = $('thread');
const vis = (id) => getComputedStyle($(id)).display !== 'none';

function fitPicker() {
  // The real app reads window.visualViewport; the space is from the viewport's top to the input.
  const top = (window.visualViewport ? window.visualViewport.offsetTop : 0) + 12;
  picker.style.maxHeight = Math.max(120, $('composer').getBoundingClientRect().top - top) + 'px';
}
function setPicker(open) { picker.hidden = !open; slash.setAttribute('aria-expanded', open); if (open) fitPicker(); }
function bubble(who, html, changed) {
  const row = document.createElement('div');
  row.className = 'row'; row.dataset.who = who; row.dataset.first = 'true';
  if (changed) row.setAttribute('data-changed', '');
  row.innerHTML = '<div class="bubble" style="border-radius:20px">' + (who === 'donna' ? '<div class="markdown">' + html + '</div>' : html) + '</div>';
  thread.appendChild(row);
}
function sync() { send.disabled = input.value.trim() === ''; }
function run(text) {
  const command = text.trim().toLowerCase().replace(/\s+/g, ' ');
  if (command === '/settings') { sheet.hidden = false; return; }
  bubble('josh', text.replace(/</g, '&lt;'));
  if (ANSWERS[command]) { bubble('donna', ANSWERS[command], true); return; }
  bubble('donna', '<p>(Donna would answer this with a model call.)</p>');
}
slash.addEventListener('pointerdown', (e) => e.preventDefault());
slash.addEventListener('click', () => setPicker(picker.hidden));
picker.addEventListener('click', (e) => {
  const item = e.target.closest('[data-command]'); if (!item) return;
  input.value = item.dataset.command; setPicker(false); input.focus(); sync();
});
document.addEventListener('pointerdown', (e) => { if (!picker.hidden && !e.target.closest('#picker, #slash')) setPicker(false); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { setPicker(false); sheet.hidden = true; } });
input.addEventListener('input', sync);
send.addEventListener('click', () => { const t = input.value.trim(); if (!t) return; input.value = ''; sync(); run(t); });
sheet.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => { sheet.hidden = true; }));
$('switch').addEventListener('click', (e) => {
  const on = e.currentTarget.getAttribute('aria-checked') !== 'true';
  e.currentTarget.setAttribute('aria-checked', on);
  $('note').hidden = false; $('note').dataset.error = 'false';
  $('note').textContent = on ? 'Notifications are on for this device.' : 'Notifications are off for this device.';
});
$('signout').addEventListener('click', () => { $('note').hidden = false; $('note').dataset.error = 'true'; $('note').textContent = "I couldn't sign you out. Check your connection and try again."; });
$('everywhere').addEventListener('click', () => { $('note').hidden = false; $('note').dataset.error = 'false'; $('note').textContent = '(Signs every device out and returns to the sign-in screen.)'; });

// Initial state from the State bar.
if (vis('s-picker')) setPicker(true);
if (vis('s-settings')) sheet.hidden = false;
if (vis('s-cost')) { bubble('josh', '/cost'); bubble('donna', ANSWERS['/cost'], true); }
if (vis('s-projects')) { bubble('josh', '/projects'); bubble('donna', ANSWERS['/projects'], true); }
if (vis('s-people')) { bubble('josh', '/people'); bubble('donna', ANSWERS['/people'], true); }
if (vis('s-error')) { bubble('josh', '/projects'); bubble('donna', ANSWERS.error, true); }
window.addEventListener('resize', () => { if (!picker.hidden) fitPicker(); });
</script>

</template>

<script>
  // States the State bar offers; the first is shown initially.
  const STATES = ["default", "picker", "settings", "cost-answer", "projects-answer", "people-answer", "answer-failed"];

  const view = document.getElementById("view");
  let state = STATES[0], highlight = false;

  function render() {
    const head = document.getElementById("PAGE_HEAD").innerHTML;
    const body = document.getElementById("PAGE_BODY").innerHTML;
    const css = `[data-state]:not([data-state~="${state}"]){display:none!important}`;
    view.srcdoc = `<!doctype html><html><head><meta charset="utf-8">` +
      `<meta name="viewport" content="width=device-width, initial-scale=1">${head}<style>${css}</style></head>` +
      `<body class="${highlight ? "orc-hl" : ""}">${body}</body></html>`;
  }

  document.querySelectorAll("[data-w]").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll("[data-w]").forEach(x => x.setAttribute("aria-pressed", x === b));
    view.style.setProperty("--w", b.dataset.w + "px");
  }));

  const states = document.getElementById("states");
  STATES.forEach((s, i) => {
    const b = document.createElement("button");
    b.textContent = s; b.setAttribute("aria-pressed", i === 0);
    b.addEventListener("click", () => {
      state = s;
      states.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
      render();
    });
    states.appendChild(b);
  });

  document.getElementById("hl").addEventListener("click", e => {
    highlight = !highlight; e.target.setAttribute("aria-pressed", highlight); render();
  });

  render();
</script>
</body>
</html>
